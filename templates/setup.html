<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobBot — Setup</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page-center">
  <div class="form-card">

    <span class="form-card-logo">JobBot</span>
    <h2>Let's get you set up</h2>
    <p class="form-card-sub">Takes about a minute. You only need to do this once.</p>

    <!-- Step dots -->
    <div class="steps">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" class="setup-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="Your Name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@email.com">
      </div>
      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" required placeholder="+90 555 000 0000">
      </div>
      <div class="form-group">
        <label for="api_key">Claude API Key</label>
        <input type="password" id="api_key" name="api_key" required placeholder="sk-ant-…">
      </div>

      <div class="form-group">
        <label>Master Resume</label>
        <div class="file-drop" id="file-drop">
          <input type="file" name="resume" accept=".docx,.doc,.pdf" required id="resume-input">
          <div class="file-drop-icon">📄</div>
          <div class="file-drop-text">Click to upload your resume</div>
          <div class="file-drop-hint">.docx, .doc, or .pdf accepted</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        Save &amp; Continue →
      </button>
    </form>

  </div>
</div>

<script>
  document.getElementById('resume-input').addEventListener('change', function(e) {
    const name = e.target.files[0]?.name;
    if (name) {
      this.closest('.file-drop').querySelector('.file-drop-text').textContent = '✓ ' + name;
      this.closest('.file-drop').style.borderColor = 'var(--clr-success)';
      this.closest('.file-drop').style.background = 'var(--clr-success-tint)';
    }
  });
</script>
</body>
</html>
