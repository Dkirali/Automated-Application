<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobBot — Settings</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page-center">
  <div class="form-card">

    <div class="form-card-toprow">
      <span class="form-card-logo">JobBot</span>
      <a href="/" class="back-link">← Dashboard</a>
    </div>

    <h2>Settings</h2>
    <p class="form-card-sub">Update your profile or swap out your master resume.</p>

    {% if success %}
      <div class="alert alert-success">✓ {{ success }}</div>
    {% endif %}
    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" class="setup-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" value="{{ name }}" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" value="{{ phone }}" required>
      </div>
      <div class="form-group">
        <label for="groq_key">Groq API Key <span class="label-hint">(free — leave blank to keep current)</span></label>
        <input type="password" id="groq_key" name="groq_key" placeholder="gsk_…">
      </div>
      <div class="form-group">
        <label for="gemini_key">Gemini API Key <span class="label-hint">(free — leave blank to keep current)</span></label>
        <input type="password" id="gemini_key" name="gemini_key" placeholder="AIza…">
      </div>
      <div class="form-group">
        <label for="api_key">Claude API Key <span class="label-hint">(leave blank to keep current)</span></label>
        <input type="password" id="api_key" name="api_key" placeholder="sk-ant-…">
      </div>

      <div class="form-group">
        <label>Master Resume</label>
        {% if current_resume %}
          <div class="file-current">📄 {{ current_resume }}</div>
        {% endif %}
        <div class="file-drop" id="file-drop">
          <input type="file" name="resume" accept=".docx,.doc,.pdf" id="resume-input">
          <div class="file-drop-icon">📤</div>
          <div class="file-drop-text">Upload a new resume to replace</div>
          <div class="file-drop-hint">.docx, .doc, or .pdf accepted</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        Save Changes
      </button>
    </form>

  </div>
</div>

<script>
  document.getElementById('resume-input').addEventListener('change', function(e) {
    const name = e.target.files[0]?.name;
    if (name) {
      this.closest('.file-drop').querySelector('.file-drop-text').textContent = '✓ ' + name;
      this.closest('.file-drop').style.borderColor = 'var(--clr-success)';
      this.closest('.file-drop').style.background = 'var(--clr-success-tint)';
    }
  });
</script>
</body>
</html>
